name: 2027届产品岗监控
on:
  schedule:
    # UTC -> Asia/Shanghai 09:17, 14:17, 20:17
    - cron: '17 1,6,12 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: '仅发送一条通知连接测试'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: campus-2027-product
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'feishu' }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 验证筛选和推送状态逻辑
        run: python -m unittest discover -s tests
      - name: 测试通知连接
        if: inputs.test_notification == true
        run: python scripts/campus_watch.py --test-notification
      - name: 检查官网新增产品岗
        if: inputs.test_notification != true
        run: python scripts/campus_watch.py
      - name: 保存数据及已推记录
        if: always() && inputs.test_notification != true
        run: |
          git config user.name 'campus-radar-bot'
          git config user.email 'campus-radar-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update 2027 campus product report [skip ci]'
            git push
          fi
      - name: 保存可下载报告
        if: always() && inputs.test_notification != true
        uses: actions/upload-artifact@v4
        with:
          name: campus-2027-product-report
          path: |
            data/campus_product.md
            data/campus_product.json
            data/health_report.json
          retention-days: 14
