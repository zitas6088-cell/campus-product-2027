name: 2027届产品岗监控（表格全部公司）
on:
  schedule:
    # UTC -> Asia/Shanghai 09:00, 15:00
    - cron: '0 1,7 * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: '仅发送一条通知连接测试'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: campus-2027-product
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      NOTIFY_CHANNEL: ${{ vars.NOTIFY_CHANNEL || 'feishu' }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      FEISHU_SIGN_SECRET: ${{ secrets.FEISHU_SIGN_SECRET }}
      WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装官网渲染依赖
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: 验证筛选和推送状态逻辑
        run: python -m unittest discover -s tests
      - name: 运行仓库必需的抓取与去重自检
        if: inputs.test_notification != true
        run: python scripts/smoke_test.py
      - name: 测试通知连接
        if: inputs.test_notification == true
        run: python scripts/campus_watch.py --test-notification
      - name: 检查全部公司新增产品校招岗
        if: inputs.test_notification != true
        run: python scripts/campus_watch.py
      - name: 保存数据及已推记录
        if: always() && inputs.test_notification != true
        run: |
          git config user.name 'campus-radar-bot'
          git config user.email 'campus-radar-bot@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update 2027 campus report [skip ci]'
            git pull --rebase origin main
            git push
          fi
      - name: 保存可下载报告
        if: always() && inputs.test_notification != true
        uses: actions/upload-artifact@v4
        with:
          name: campus-2027-product-report
          path: |
            data/campus_product.md
            data/campus_product.json
            data/health_report.json
            data/company_monitor_coverage.json
            data/company_monitor_coverage.md
            data/official_board_snapshot.json
          retention-days: 14
